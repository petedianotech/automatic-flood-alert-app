name: Build Android APK (Free)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    name: Build Flood Alert APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Native Android Assets
        run: |
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Compile and Package APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dzenje-Flood-Alert.apk

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dzenje-Flood-Alert-APK
          path: build-output/Dzenje-Flood-Alert.apk
          retention-days: 30

