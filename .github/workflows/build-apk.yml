name: Build Android APK (Free)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    name: Build Flood Alert APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Native Android Assets
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Dzenje-Flood-Alert.apk

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dzenje-Flood-Alert-APK
          path: build-output/Dzenje-Flood-Alert.apk
          retention-days: 30

